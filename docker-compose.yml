version: "3.9"

services:
  db:
    image: postgres:16
    container_name: go_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 71882
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
